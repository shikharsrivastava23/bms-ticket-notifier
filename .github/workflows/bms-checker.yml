name: BMS Ticket Checker

on:
  # Triggered externally via cron-job.org (workflow_dispatch API) for reliable timing
  workflow_dispatch:

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run checker
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # The Social Reckoning (Hyderabad) — Fri 9 / Sat 10 / Sun 11 Oct at ALLU / AMB / Prism
          BMS_URLS: https://in.bookmyshow.com/movies/hyderabad/the-social-reckoning/buytickets/ET00506449/20261009
          BMS_DATES: '20261009,20261010,20261011'
          BMS_THEATRE: 'Allu,AMB,Prism'
          BMS_TIME: ''
        run: uv run main.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bms_state.json
          git diff --cached --quiet || (git commit -m "chore: update bms_state.json [skip ci]" && git push)
